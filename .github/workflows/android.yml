name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.9
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    - name: Build APK with Gradle
      run: |
        # Trova la cartella dove c'è settings.gradle.kts
        PROJ_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
        if [ -z "$PROJ_DIR" ]; then PROJ_DIR="."; fi
        echo "Compilazione nella directory: $PROJ_DIR"
        cd "$PROJ_DIR"
        
        # Genera il wrapper compatibile con Gradle 8.9 ed esegue il build
        gradle wrapper --gradle-version 8.9
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: promemoria-vocale-apk
        path: "**/app/build/outputs/apk/debug/*.apk"
        if-no-files-found: warn
